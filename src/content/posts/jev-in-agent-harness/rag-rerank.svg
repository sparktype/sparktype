<rect x="160" y="346" width="16" height="12" rx="3" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1"/>
<text x="184" y="356" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">Jev 결정 호출</text>
<rect x="310" y="346" width="16" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="334" y="356" fill="#4f5d75" font-size="12" font-family="'Geist','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">최종 생성</text>
