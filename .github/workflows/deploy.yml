name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # 진단 결과: 이 러너의 DNS는 registry.npmjs.org를 IPv6 주소만 반환하고
      # (getent hosts), curl은 Happy Eyeballs로 성공하지만 bun의 리졸버는
      # IPv6 경로를 그대로 타다 실패해 DNSResolveFailed로 나타난다. gai.conf로
      # IPv4를 우선하도록 만들어 근본 원인을 해결한다.
      - name: Prefer IPv4 over IPv6 for DNS resolution
        run: echo "precedence ::ffff:0:0/96 100" | sudo tee -a /etc/gai.conf

      # 위 수정 후에도 혹시 남을 수 있는 일시적 네트워크 실패에 대한 안전망으로
      # ulimit을 올리고 동시성을 낮춘 뒤 최대 3회 재시도한다.
      - name: Install dependencies (with retry)
        env:
          BUN_CONFIG_NETWORK_CONCURRENCY: '8'
        run: |
          ulimit -n 65536
          for attempt in 1 2 3; do
            echo "install attempt $attempt"
            bun install && exit 0
            echo "attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build
        run: bun run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
