name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Linux에서 getaddrinfo는 기본적으로 캐싱되지 않는데, bun install이
      # 짧은 시간에 동시 DNS 조회를 몰아서 보내면 파일 디스크립터가 고갈되어
      # (EMFILE) DNSResolveFailed로 나타나는 known 이슈다(oven-sh/bun#10731).
      # ulimit을 올리고 동시성을 낮춘 뒤에도, 실패 시 최대 3회 재시도한다.
      - name: Install dependencies (with retry)
        env:
          BUN_CONFIG_NETWORK_CONCURRENCY: '8'
        run: |
          ulimit -n 65536
          for attempt in 1 2 3; do
            echo "install attempt $attempt"
            bun install && exit 0
            echo "attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build
        run: bun run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
